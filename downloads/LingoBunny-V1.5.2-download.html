<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingo Bunny V1.5.2 Android 下载</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.6}
button{font-size:18px;padding:12px 20px;cursor:pointer}
progress{width:100%;height:22px}
code{word-break:break-all}
.ok{color:#087a2b}.err{color:#b00020}
</style>
</head>
<body>
<h1>Lingo Bunny V1.5.2 Android</h1>
<p>这是原始 84MB 正式 APK 的浏览器下载页。页面只负责传输和拼接，不修改 APK 内容。</p>
<p><button id="go">下载完整 APK</button></p>
<progress id="bar" max="41" value="0"></progress>
<p id="status">尚未开始</p>
<p>正确 SHA256：<br><code>71652ca5b25d97ca4faad2116a1ac304cd3391343e5a1e9e73cb4f1955a3bf5e</code></p>
<script>
const COUNT=41;
const EXPECTED="71652ca5b25d97ca4faad2116a1ac304cd3391343e5a1e9e73cb4f1955a3bf5e";
const btn=document.getElementById('go');
const bar=document.getElementById('bar');
const status=document.getElementById('status');
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
btn.onclick=async()=>{
  btn.disabled=true; bar.value=0; status.className=''; status.textContent='开始下载…';
  try{
    const chunks=[];
    let total=0;
    for(let i=0;i<COUNT;i++){
      const n=String(i).padStart(3,'0');
      status.textContent='正在下载 '+(i+1)+' / '+COUNT;
      const r=await fetch('./v152-original-parts/part-'+n+'.bin',{cache:'no-store'});
      if(!r.ok) throw new Error('分块 '+n+' 下载失败：HTTP '+r.status);
      const b=new Uint8Array(await r.arrayBuffer());
      chunks.push(b); total+=b.byteLength; bar.value=i+1;
    }
    status.textContent='下载完成，正在校验 SHA256…';
    const all=new Uint8Array(total); let off=0;
    for(const c of chunks){all.set(c,off);off+=c.byteLength}
    const digest=hex(await crypto.subtle.digest('SHA-256',all));
    if(digest!==EXPECTED) throw new Error('SHA256 不一致：'+digest);
    status.className='ok';
    status.textContent='校验通过，正在生成 APK 下载…';
    const blob=new Blob([all],{type:'application/vnd.android.package-archive'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='LingoBunny-V1.5.2-Android-MultiKid-Sync-FINAL.apk';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    status.textContent='校验通过，APK 已生成。大小 '+(total/1024/1024).toFixed(1)+' MB。';
  }catch(e){
    status.className='err'; status.textContent='失败：'+e.message; btn.disabled=false;
  }
};
</script>
</body>
</html>
